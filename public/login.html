<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f4b3f">
  <title>Acceso — SmartPetFeeder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1d2b22; background: radial-gradient(circle at top, #e7efe7 0, #f4f6f1 46%, #eef2eb 100%);
    }
    .card {
      width: min(100%, 420px); background: #fff; border: 1px solid #dfe7dc; border-radius: 24px;
      padding: 34px; box-shadow: 0 24px 70px rgba(31, 75, 63, 0.14);
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand-icon { font-size: 44px; line-height: 1; }
    h1 { margin: 10px 0 6px; font-size: 1.7rem; }
    .subtitle { color: #66766b; font-size: 0.93rem; line-height: 1.45; }
    label { display: block; font-size: 0.86rem; font-weight: 650; margin: 16px 0 7px; }
    input {
      width: 100%; border: 1.5px solid #d6dfd3; border-radius: 12px; padding: 12px 14px;
      font: inherit; color: #1d2b22; background: #fafbf9; outline: none;
    }
    input:focus { border-color: #1f4b3f; box-shadow: 0 0 0 3px rgba(31, 75, 63, 0.13); }
    button {
      width: 100%; margin-top: 22px; border: 0; border-radius: 12px; padding: 13px 16px;
      font: inherit; font-weight: 700; color: #fff; background: #1f4b3f; cursor: pointer;
    }
    button:hover { background: #173b32; }
    button:disabled { opacity: 0.65; cursor: wait; }
    .message { min-height: 22px; margin-top: 14px; font-size: 0.88rem; text-align: center; color: #a0382c; }
    .hint { margin-top: 18px; color: #66766b; font-size: 0.78rem; text-align: center; line-height: 1.45; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">🐾</div>
      <h1 id="title">SmartPetFeeder</h1>
      <p class="subtitle" id="subtitle">Inicia sesión para controlar el alimentador.</p>
    </div>

    <form id="authForm">
      <div id="setupCodeGroup" class="hidden">
        <label for="setupCode">Código de configuración</label>
        <input id="setupCode" name="setupCode" type="text" maxlength="8"
               autocomplete="one-time-code" autocapitalize="characters">
      </div>

      <label for="username">Usuario</label>
      <input id="username" name="username" type="text" minlength="3" maxlength="32"
             pattern="[A-Za-z0-9._-]+" autocomplete="username" required autofocus>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" minlength="10" maxlength="128"
             autocomplete="current-password" required>

      <div id="confirmGroup" class="hidden">
        <label for="confirmPassword">Repetir contraseña</label>
        <input id="confirmPassword" name="confirmPassword" type="password" minlength="10" maxlength="128"
               autocomplete="new-password">
      </div>

      <button id="submitButton" type="submit">Entrar</button>
      <div id="message" class="message" role="alert"></div>
    </form>

    <p class="hint" id="hint">La sesión se mantendrá protegida durante siete días.</p>
  </main>

  <script>
    const form = document.getElementById('authForm');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const confirmGroup = document.getElementById('confirmGroup');
    const setupCodeGroup = document.getElementById('setupCodeGroup');
    const setupCode = document.getElementById('setupCode');
    const confirmPassword = document.getElementById('confirmPassword');
    const password = document.getElementById('password');
    const button = document.getElementById('submitButton');
    const message = document.getElementById('message');
    const hint = document.getElementById('hint');
    let setupRequired = false;

    async function loadStatus() {
      try {
        const response = await fetch('/api/auth/status', { cache: 'no-store' });
        const status = await response.json();
        if (status.authenticated) {
          window.location.replace('/');
          return;
        }
        setupRequired = !!status.setup_required;
        if (setupRequired) {
          title.textContent = 'Crear administrador';
          subtitle.textContent = 'Primera configuración de SmartPetFeeder.';
          setupCodeGroup.classList.remove('hidden');
          setupCode.required = true;
          confirmGroup.classList.remove('hidden');
          confirmPassword.required = true;
          password.autocomplete = 'new-password';
          button.textContent = 'Crear cuenta';
          hint.textContent = 'El código aparece en la terminal al iniciar el servidor. Usa una contraseña de al menos 10 caracteres.';
        }
      } catch {
        message.textContent = 'No se pudo contactar con el servidor.';
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';
      if (setupRequired && password.value !== confirmPassword.value) {
        message.textContent = 'Las contraseñas no coinciden.';
        return;
      }
      button.disabled = true;
      try {
        const endpoint = setupRequired ? '/api/auth/setup' : '/api/auth/login';
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: password.value,
            setup_code: setupRequired ? setupCode.value : undefined,
          }),
        });
        const result = await response.json();
        if (!response.ok) {
          if (result.status === 'setup_required') {
            setupRequired = true;
            await loadStatus();
          }
          message.textContent = result.message || 'No se pudo iniciar sesión.';
          return;
        }
        window.location.replace('/');
      } catch {
        message.textContent = 'No se pudo contactar con el servidor.';
      } finally {
        button.disabled = false;
      }
    });

    loadStatus();
  </script>
</body>
</html>
